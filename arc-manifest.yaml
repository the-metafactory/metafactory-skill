schema: arc/v1
name: package-builder
version: 0.1.0
type: skill
tier: official
description: >
  Build conformant arc-installable packages for the metafactory ecosystem — the
  canonical PackageBuilder skill: manifest conventions, blueprint tracking, compass
  governance, content-filter safety, test-rig verification, trust metadata, and PR
  quality standards.
license: Apache-2.0
namespace: "@metafactory"

author:
  name: Andreas
  github: aastroem

provides:
  skill:
    - name: PackageBuilder
      path: skill/
      trigger: build package

depends_on:
  tools:
    - name: bun

capabilities:
  filesystem:
    read: []
    write: []
  network: []
  bash:
    allowed: false
  secrets: []

bundle:
  exclude:
    - vendor
    - MEMORY
    - node_modules
    - .git
    - Plans
    - test
